<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <title>Etiqueta</title>

  <style>

    /* =========================================================
       CONFIGURAÇÃO BÁSICA
       ========================================================= */

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: white;
    }


    /* =========================================================
       ÁREA DA ETIQUETA
       ========================================================= */

    .etiqueta {
      position: relative;

      margin: 0;
      padding: 0;
    }


    /* =========================================================
       PV / OC
       ========================================================= */

    #pvoc {
      position: absolute;

      left: 90mm;
      top: 5mm;

      margin: 0;
      padding: 0;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 5mm;
      line-height: 1;

      font-weight: bold;

      white-space: nowrap;
    }

    #pvoc div {
      margin: 0;
      padding: 0;
    }


    /* =========================================================
       BOTÃO
       ========================================================= */

    #btnImprimir {
      margin: 10px;

      padding: 8px 16px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }


    /* =========================================================
       IMPRESSÃO
       ========================================================= */

    @media print {

      #btnImprimir {
        display: none;
      }

    }

  </style>

</head>


<body onload="carregarEtiqueta()">


  <!-- =========================================================
       BOTÃO
       ========================================================= -->

  <button
    id="btnImprimir"
    onclick="window.print()">

    Imprimir

  </button>


  <!-- =========================================================
       ETIQUETA
       ========================================================= -->

  <div class="etiqueta">

    <div id="pvoc">

      <div>
        <strong>PV:</strong>
        <span id="pv"></span>
      </div>

      <div>
        <strong>OC:</strong>
        <span id="oc"></span>
      </div>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    function carregarEtiqueta() {

      const params =
        new URLSearchParams(window.location.search);


      document.getElementById("pv").innerText =
        params.get("pv") || "";


      document.getElementById("oc").innerText =
        params.get("oc") || "";

    }

  </script>


</body>

</html>
