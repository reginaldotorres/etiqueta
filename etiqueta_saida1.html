<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=80mm, initial-scale=1.0">

  <title>Etiqueta</title>

  <style>

    /* =========================================================
       CONFIGURAÇÃO DA ETIQUETA
       ========================================================= */

    @page {
      size: 80mm 65mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 80mm;
      height: 55mm;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: white;
    }


    /* =========================================================
       BOTÃO DE IMPRESSÃO
       ========================================================= */

    #btnImprimir {

      margin: 10px;

      padding: 8px 16px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    /* =========================================================
       ETIQUETA
       ========================================================= */

    .etiqueta {

      width: 80mm;
      height: 65mm;

      padding: 3mm;

      position: relative;

      overflow: hidden;

      display: flex;

      flex-direction: column;

    }


    /* =========================================================
       TÍTULO
       ========================================================= */

    h3 {

      width: 100%;

      text-align: center;

      margin: 0 0 2.5mm 0;

      padding: 0;

      font-size: 14px;

      line-height: 1.1;

      font-weight: bold;

      white-space: nowrap;

    }


    /* =========================================================
       LINHAS DE INFORMAÇÃO
       ========================================================= */

    p {

      margin: 0.8mm 0;

      padding: 0;

      font-size: 12px;

      line-height: 1.15;

      white-space: nowrap;

    }

    p strong {

      font-weight: bold;

    }


    /* =========================================================
       QR CODE
       ========================================================= */

    #qrcode {

      position: absolute;

      right: 3mm;

      bottom: 3mm;

      width: 21mm;

      height: 21mm;

      object-fit: contain;

    }


    /* =========================================================
       IMPRESSÃO
       ========================================================= */

    @media print {

      html,
      body {

        width: 80mm;

        height: 55mm;

        margin: 0;

        padding: 0;

      }

      #btnImprimir {

        display: none;

      }

      .etiqueta {

        width: 80mm;

        height: 55mm;

        margin: 0;

        padding: 3mm;

        page-break-after: avoid;

        page-break-before: avoid;

        page-break-inside: avoid;

      }

    }

  </style>

</head>


<body onload="carregarEtiqueta()">


  <!-- =========================================================
       BOTÃO
       ========================================================= -->

  <button
    id="btnImprimir"
    onclick="window.print()">

    Imprimir

  </button>


  <!-- =========================================================
       ETIQUETA
       ========================================================= -->

  <div class="etiqueta">


    <h3>
      Núcleo Ind. e Com. de Ferroligas LTDA
    </h3>


    <p>
      <strong>PV:</strong>
      <span id="pv"></span>

      &nbsp;&nbsp;|&nbsp;&nbsp;

      <strong>OC:</strong>
      <span id="oc"></span>

      &nbsp;&nbsp;|&nbsp;&nbsp;

      <strong>DN:</strong>
      <span id="dn"></span>
    </p>


    <p>
      <strong>Parceiro:</strong>
      <span id="cod_parceiro"></span>

      &nbsp;-&nbsp;

      <span id="parceiro"></span>
    </p>


    <p>
      <strong>Código:</strong>
      <span id="codigo"></span>

      &nbsp;-&nbsp;

      <span id="descricao"></span>
    </p>


    <p>
      <strong>Gran.:</strong>
      <span id="granulometria"></span>
    </p>


    <p>
      <strong>Peso Bruto:</strong>
      <span id="pesobruto"></span>
      &nbsp;KG
    </p>


    <p>
      <strong>Peso Líquido:</strong>
      <span id="pesoliquido"></span>
      &nbsp;KG
    </p>


    <p>
      <strong>Lote:</strong>
      <span id="lote"></span>
    </p>


    <p>
      <strong>Fabricação:</strong>
      <span id="pvdata"></span>
    </p>


    <p>
      <strong>Validade:</strong>
      Indeterminada
    </p>


    <!-- QR CODE -->

    <img
      id="qrcode"
      src=""
      alt="QR Code">


  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    function carregarEtiqueta() {

      const params =
        new URLSearchParams(window.location.search);


      /* PV */

      document.getElementById("pv").innerText =
        params.get("pv") || "";


      /* OC */

      document.getElementById("oc").innerText =
        params.get("oc") || "";


      /* DN */

      document.getElementById("dn").innerText =
        params.get("dn") || "";


      /* PARCEIRO */

      document.getElementById("cod_parceiro").innerText =
        params.get("cod_parceiro") || "";


      document.getElementById("parceiro").innerText =
        params.get("parceiro") || "";


      /* PRODUTO */

      document.getElementById("codigo").innerText =
        params.get("codigo") || "";


      document.getElementById("descricao").innerText =
        params.get("descricao") || "";


      /* GRANULOMETRIA */

      document.getElementById("granulometria").innerText =
        params.get("granulometria") || "";


      /* PESOS */

      document.getElementById("pesobruto").innerText =
        params.get("pesobruto") || "";


      document.getElementById("pesoliquido").innerText =
        params.get("pesoliquido") || "";


      /* LOTE */

      document.getElementById("lote").innerText =
        params.get("lote") || "";


      /* DATA */

      document.getElementById("pvdata").innerText =
        params.get("pvdata") || "";


      /* =====================================================
         QR CODE
         ===================================================== */

      const qr =
        params.get("qr");


      if (qr) {

        document.getElementById("qrcode").src =
          decodeURIComponent(qr);

      }

    }

  </script>


</body>

</html>
