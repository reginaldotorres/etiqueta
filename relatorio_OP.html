
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Desvio</title>

    <style>
        @page {
            size: 100mm 50mm;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100mm;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
        }

        .etiqueta {
            width: 100mm;
            height: 50mm;
            padding: 2mm 5mm;
            page-break-after: always;
            break-after: page;

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .titulo {
            text-align: center;
            font-size: 13pt;
            font-weight: bold;
            margin-bottom: 2mm;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10pt;
            margin-bottom: 2mm;
            width: 100%;
        }

        .label {
            font-weight: bold;
        }

        .obs-titulo {
            font-size: 8pt;
            font-weight: bold;
            margin-bottom: 1mm;
        }

        .observacao {
            flex: 1;
            width: 100%;
            font-size: 9pt;
            line-height: 1.15;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow: hidden;
        }

        .rodape {
            font-size: 9pt;
            color: #555;
            text-align: right;
            margin-top: 1mm;
        }

        @media print {
            html, body {
                margin: 0;
                padding: 0;
            }

            .etiqueta:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body>

    <div id="etiquetas"></div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const lote = params.get("lote") || "";
        const rnc = params.get("rnc") || "";
        const observacao = params.get("observacao") || "";

        let quantidade = parseInt(params.get("quantidade"));

        if (isNaN(quantidade) || quantidade < 1) {
            quantidade = 1;
        }

        const dataHora = new Date().toLocaleString("pt-BR");

        const container = document.getElementById("etiquetas");

        for (let i = 0; i < quantidade; i++) {

            const etiqueta = document.createElement("div");
            etiqueta.className = "etiqueta";

            const titulo = document.createElement("div");
            titulo.className = "titulo";
            titulo.textContent = "ALERTA DE DESVIO";

            const cabecalho = document.createElement("div");
            cabecalho.className = "cabecalho";

            const loteDiv = document.createElement("div");
            loteDiv.innerHTML = '<span class="label">Lote:</span> ';
            loteDiv.append(document.createTextNode(lote));

            const rncDiv = document.createElement("div");
            rncDiv.innerHTML = '<span class="label">RNC:</span> ';
            rncDiv.append(document.createTextNode(rnc));

            cabecalho.append(loteDiv, rncDiv);

            const obsTitulo = document.createElement("div");
            obsTitulo.className = "obs-titulo";
            obsTitulo.textContent = "OBSERVAÇÃO:";

            const obs = document.createElement("div");
            obs.className = "observacao";
            obs.textContent = observacao;

            const rodape = document.createElement("div");
            rodape.className = "rodape";
            rodape.textContent = "Impressão: " + dataHora;

            etiqueta.append(
                titulo,
                cabecalho,
                obsTitulo,
                obs,
                rodape
            );

            container.appendChild(etiqueta);
        }

        window.onload = function () {
            setTimeout(() => window.print(), 300);
        };

    </script>

</body>
</html>
